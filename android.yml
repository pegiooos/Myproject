name: Build GuestLab APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GuestLab
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check GuestLab source archive
        run: |
          set -eu
          if [ ! -f GuestLab.zip ]; then
            echo "::error::GuestLab.zip was not found in the repository root."
            find . -maxdepth 3 -type f
            exit 1
          fi
          unzip -t GuestLab.zip

      - name: Extract GuestLab
        run: |
          mkdir -p source
          unzip -oq GuestLab.zip -d source
          echo "Extracted files:"
          find source -maxdepth 4 -type f | head -200

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)
          if [ -n "$SETTINGS" ]; then
            ROOT=$(dirname "$SETTINGS")
          else
            BUILD=$(find source -type f \
              \( -name build.gradle -o -name build.gradle.kts \) \
              -not -path '*/.gradle/*' -not -path '*/build/*' | head -n 1 || true)
            if [ -z "$BUILD" ]; then
              echo "::error::No Gradle build files found inside GuestLab.zip."
              exit 1
            fi
            ROOT=$(dirname "$BUILD")
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Select Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep -q 'Gradle 8.9'

      - name: Build GuestLab with installed Gradle 8.9
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gradle assembleDebug --stacktrace --no-daemon \
            2>&1 | tee "$GITHUB_WORKSPACE/guestlab-build.log"
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "===== Gradle error summary ====="
            grep -n -A 8 -B 3 -E \
              'What went wrong:|Caused by:|Could not resolve|SDK location not found|requires Java|error:' \
              "$GITHUB_WORKSPACE/guestlab-build.log" | head -120 || true
            exit "$STATUS"
          fi

      - name: Upload GuestLab APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GuestLab-debug-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: GuestLab-build-log
          path: guestlab-build.log
          if-no-files-found: ignore
          retention-days: 7
